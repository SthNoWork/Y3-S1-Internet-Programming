<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%" style="background:#f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .text-sm { font-size: 12px; fill: #64748b; }
      .text-md { font-size: 14px; fill: #334155; }
      .text-bold { font-weight: 600; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .box-muted { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
      .map-bg { fill: #e2e8f0; rx: 10; stroke: #cbd5e1; stroke-width: 1.5; }
      .map-road { stroke: #ffffff; stroke-width: 6; stroke-linecap: round; }
      .map-river { stroke: #bae6fd; stroke-width: 16; stroke-linecap: round; fill: none; }
      .badge-pfp { fill: #0284c7; stroke: #ffffff; stroke-width: 2; }
    </style>
  </defs>

  <!-- Navbar -->
  <rect x="20" y="20" width="760" height="50" class="box" />
  <text x="40" y="52" class="title">🐾 Paw Finder</text>
  <rect x="520" y="30" width="65" height="30" class="box-muted" />
  <text x="552" y="50" class="text-md" text-anchor="middle">Browse</text>
  <rect x="595" y="30" width="85" height="30" fill="#e0f2fe" stroke="#0284c7" rx="6" />
  <text x="637" y="50" class="text-md text-bold" fill="#0284c7" text-anchor="middle">Shelter Map</text>
  <rect x="690" y="30" width="65" height="30" class="box-muted" />
  <text x="722" y="50" class="text-md" text-anchor="middle">Profile</text>

  <!-- Page Header -->
  <text x="25" y="100" class="title">Shelters &amp; Foster Map</text>
  <text x="25" y="120" class="text-sm">Hover over location markers to view posters and available animals. Click to view profile.</text>

  <!-- Main Layout -->
  <!-- Left Side: Interactive Leaflet Map -->
  <g transform="translate(20, 135)">
    <rect width="490" height="490" class="map-bg" />

    <!-- Simulated Map Features (River & Roads) -->
    <path d="M 380,0 Q 320,180 340,300 T 420,490" class="map-river" />
    <path d="M 0,160 L 490,140" class="map-road" />
    <path d="M 0,320 L 490,340" class="map-road" />
    <path d="M 180,0 L 160,490" class="map-road" />
    <path d="M 330,0 L 310,490" class="map-road" />

    <!-- Circular PFP Marker 1 (Daun Penh) -->
    <g transform="translate(230, 190)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#0284c7" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.2))" />
      <circle cx="0" cy="0" r="18" fill="#e0f2fe" />
      <text x="0" y="4" font-size="11" font-weight="700" fill="#0369a1" text-anchor="middle">PFP 1</text>
      <!-- Pointer Tip -->
      <polygon points="-6,21 6,21 0,28" fill="#0284c7" />
      <circle cx="14" cy="-14" r="8" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
      <text x="14" y="-11" font-size="9" fill="#ffffff" text-anchor="middle">🐾</text>

      <!-- Hover Popup Card -->
      <g transform="translate(-110, -145)">
        <rect width="220" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.15))" />
        <circle cx="28" cy="30" r="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
        <text x="28" y="34" font-size="9" fill="#0369a1" font-weight="700" text-anchor="middle">PFP</text>
        <text x="52" y="26" font-size="13" font-weight="700" fill="#0f172a">Happy Paws Shelter</text>
        <text x="52" y="40" font-size="11" fill="#64748b">📍 Daun Penh, Phnom Penh</text>

        <rect x="15" y="54" width="130" height="20" rx="4" fill="#f0f9ff" />
        <text x="80" y="68" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">🐾 2 animals available</text>

        <line x1="15" y1="82" x2="205" y2="82" stroke="#f1f5f9" stroke-width="1" />
        <text x="15" y="98" font-size="11" font-weight="700" fill="#2563eb">Click marker to view profile →</text>
        <!-- Popup arrow -->
        <polygon points="100,110 120,110 110,120" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      </g>
    </g>

    <!-- Circular PFP Marker 2 (BKK1) -->
    <g transform="translate(190, 290)">
      <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#ffffff" stroke-width="3" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.25))" />
      <circle cx="0" cy="0" r="17" fill="#f1f5f9" />
      <text x="0" y="4" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">PFP 2</text>
      <polygon points="-5,19 5,19 0,25" fill="#ffffff" />
      <circle cx="12" cy="-12" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
      <text x="12" y="-9" font-size="8" fill="#ffffff" text-anchor="middle">🐾</text>
    </g>

    <!-- Circular PFP Marker 3 (Riverside) -->
    <g transform="translate(290, 110)">
      <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#ffffff" stroke-width="3" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.25))" />
      <circle cx="0" cy="0" r="17" fill="#f1f5f9" />
      <text x="0" y="4" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">PFP 3</text>
      <polygon points="-5,19 5,19 0,25" fill="#ffffff" />
      <circle cx="12" cy="-12" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
      <text x="12" y="-9" font-size="8" fill="#ffffff" text-anchor="middle">🐾</text>
    </g>

    <!-- Circular PFP Marker 4 (Sen Sok) -->
    <g transform="translate(90, 90)">
      <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#ffffff" stroke-width="3" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.25))" />
      <circle cx="0" cy="0" r="17" fill="#f1f5f9" />
      <text x="0" y="4" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">PFP 4</text>
      <polygon points="-5,19 5,19 0,25" fill="#ffffff" />
      <circle cx="12" cy="-12" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
      <text x="12" y="-9" font-size="8" fill="#ffffff" text-anchor="middle">🐾</text>
    </g>

    <!-- Circular PFP Marker 5 (Chbar Ampov) -->
    <g transform="translate(380, 410)">
      <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#ffffff" stroke-width="3" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.25))" />
      <circle cx="0" cy="0" r="17" fill="#f1f5f9" />
      <text x="0" y="4" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">PFP 5</text>
      <polygon points="-5,19 5,19 0,25" fill="#ffffff" />
      <circle cx="12" cy="-12" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
      <text x="12" y="-9" font-size="8" fill="#ffffff" text-anchor="middle">🐾</text>
    </g>
  </g>

  <!-- Right Side: Caretakers Directory Panel -->
  <g transform="translate(530, 135)">
    <rect width="250" height="490" class="box" />
    <text x="16" y="28" class="text-md text-bold">Registered Caretakers (5)</text>
    <text x="16" y="46" font-size="11" fill="#64748b">Click to pinpoint on map:</text>

    <!-- Item 1 (Active) -->
    <g transform="translate(14, 60)">
      <rect width="222" height="74" rx="8" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="28" cy="37" r="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
      <text x="28" y="41" font-size="10" fill="#0369a1" font-weight="600" text-anchor="middle">PFP</text>
      <text x="54" y="26" font-size="12" font-weight="700" fill="#0f172a">Happy Paws Shelter</text>
      <text x="54" y="40" font-size="10" fill="#64748b">📍 Daun Penh</text>
      <rect x="54" y="48" width="68" height="16" rx="8" fill="#e0f2fe" />
      <text x="88" y="60" font-size="9" font-weight="600" fill="#0369a1" text-anchor="middle">2 available</text>
      <text x="210" y="60" font-size="10" font-weight="600" fill="#0284c7" text-anchor="end">View →</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(14, 144)">
      <rect width="222" height="74" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="28" cy="37" r="18" fill="#e2e8f0" />
      <text x="28" y="41" font-size="10" fill="#475569" font-weight="600" text-anchor="middle">PFP</text>
      <text x="54" y="26" font-size="12" font-weight="700" fill="#0f172a">Phnom Penh Stray Care</text>
      <text x="54" y="40" font-size="10" fill="#64748b">📍 Wat Phnom</text>
      <rect x="54" y="48" width="68" height="16" rx="8" fill="#e0f2fe" />
      <text x="88" y="60" font-size="9" font-weight="600" fill="#0369a1" text-anchor="middle">2 available</text>
      <text x="210" y="60" font-size="10" font-weight="600" fill="#0284c7" text-anchor="end">View →</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(14, 228)">
      <rect width="222" height="74" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="28" cy="37" r="18" fill="#e2e8f0" />
      <text x="28" y="41" font-size="10" fill="#475569" font-weight="600" text-anchor="middle">PFP</text>
      <text x="54" y="26" font-size="12" font-weight="700" fill="#0f172a">Mekong Animal Foster</text>
      <text x="54" y="40" font-size="10" fill="#64748b">📍 Chbar Ampov</text>
      <rect x="54" y="48" width="68" height="16" rx="8" fill="#e0f2fe" />
      <text x="88" y="60" font-size="9" font-weight="600" fill="#0369a1" text-anchor="middle">2 available</text>
      <text x="210" y="60" font-size="10" font-weight="600" fill="#0284c7" text-anchor="end">View →</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(14, 312)">
      <rect width="222" height="74" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="28" cy="37" r="18" fill="#e2e8f0" />
      <text x="28" y="41" font-size="10" fill="#475569" font-weight="600" text-anchor="middle">PFP</text>
      <text x="54" y="26" font-size="12" font-weight="700" fill="#0f172a">Rescue Paws Sen Sok</text>
      <text x="54" y="40" font-size="10" fill="#64748b">📍 Sen Sok</text>
      <rect x="54" y="48" width="68" height="16" rx="8" fill="#e0f2fe" />
      <text x="88" y="60" font-size="9" font-weight="600" fill="#0369a1" text-anchor="middle">2 available</text>
      <text x="210" y="60" font-size="10" font-weight="600" fill="#0284c7" text-anchor="end">View →</text>
    </g>

    <!-- Item 5 (Empty case) -->
    <g transform="translate(14, 396)">
      <rect width="222" height="74" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="28" cy="37" r="18" fill="#e2e8f0" />
      <text x="28" y="41" font-size="10" fill="#475569" font-weight="600" text-anchor="middle">PFP</text>
      <text x="54" y="26" font-size="12" font-weight="700" fill="#0f172a">Empty Nest Rescue</text>
      <text x="54" y="40" font-size="10" fill="#64748b">📍 BKK1</text>
      <rect x="54" y="48" width="68" height="16" rx="8" fill="#f1f5f9" />
      <text x="88" y="60" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle">0 available</text>
      <text x="210" y="60" font-size="10" font-weight="600" fill="#0284c7" text-anchor="end">View →</text>
    </g>
  </g>
</svg>
