<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%" style="background:#f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
      .text-sm { font-size: 12px; fill: #64748b; }
      .text-md { font-size: 14px; fill: #334155; }
      .text-bold { font-weight: 600; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .box-muted { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
      .badge { fill: #e2e8f0; rx: 12; }
      .badge-primary { fill: #e0f2fe; stroke: #0284c7; rx: 12; }
      .btn { fill: #0284c7; rx: 6; }
      .btn-text { font-size: 13px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <!-- Navbar -->
  <rect x="20" y="20" width="760" height="50" class="box" />
  <text x="40" y="52" class="title">🐾 PawMatch - Animal Adoption</text>
  <rect x="620" y="30" width="70" height="30" class="box-muted" />
  <text x="655" y="50" class="text-md text-bold" text-anchor="middle">Browse</text>
  <rect x="700" y="30" width="65" height="30" class="box-muted" />
  <text x="732" y="50" class="text-md" text-anchor="middle">Profile</text>

  <!-- Page Title -->
  <text x="25" y="100" class="title">Available Animals for Adoption</text>
  <text x="25" y="120" class="text-sm">Filter and search companion animals looking for loving homes.</text>

  <!-- Filters Bar (AnimalFilters Component) -->
  <rect x="20" y="135" width="760" height="85" class="box" />
  <!-- Search Input -->
  <text x="35" y="158" class="text-sm text-bold">Search Name/Details</text>
  <rect x="35" y="168" width="220" height="36" class="box-muted" />
  <text x="45" y="191" class="text-sm">🔍 Search by name...</text>

  <!-- Species Filter -->
  <text x="275" y="158" class="text-sm text-bold">Species</text>
  <rect x="275" y="168" width="130" height="36" class="box-muted" />
  <text x="285" y="191" class="text-sm">All Species ▾</text>

  <!-- Tag Filter -->
  <text x="425" y="158" class="text-sm text-bold">Filter Tag</text>
  <rect x="425" y="168" width="140" height="36" class="box-muted" />
  <text x="435" y="191" class="text-sm">All Tags ▾</text>

  <!-- Sort Dropdown -->
  <text x="585" y="158" class="text-sm text-bold">Sort By</text>
  <rect x="585" y="168" width="180" height="36" class="box-muted" />
  <text x="595" y="191" class="text-sm">Newest First ▾</text>

  <!-- Animal Cards Grid (AnimalCard Components) -->
  <!-- Card 1 -->
  <g transform="translate(20, 240)">
    <rect width="240" height="320" class="box" />
    <rect x="10" y="10" width="220" height="140" class="box-muted" />
    <text x="120" y="85" class="text-sm" text-anchor="middle">[ Animal Photo ]</text>
    <rect x="15" y="120" width="70" height="22" class="badge-primary" />
    <text x="50" y="135" font-size="11" font-weight="600" fill="#0369a1" text-anchor="middle">AVAILABLE</text>

    <text x="15" y="175" class="text-md text-bold">Luna</text>
    <text x="225" y="175" class="text-sm" text-anchor="end">Dog</text>
    <text x="15" y="195" class="text-sm">Friendly golden retriever who loves</text>
    <text x="15" y="210" class="text-sm">kids and outdoor parks.</text>

    <!-- Tags -->
    <rect x="15" y="225" width="70" height="20" class="badge" />
    <text x="50" y="239" font-size="10" fill="#475569" text-anchor="middle">Vaccinated</text>
    <rect x="90" y="225" width="60" height="20" class="badge" />
    <text x="120" y="239" font-size="10" fill="#475569" text-anchor="middle">Neutered</text>

    <line x1="15" y1="260" x2="225" y2="260" stroke="#e2e8f0" stroke-width="1" />
    <text x="15" y="280" font-size="11" fill="#64748b">Shelter: Happy Paws</text>
    <text x="15" y="295" font-size="11" fill="#0284c7" font-weight="600">View Owner Profile →</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(280, 240)">
    <rect width="240" height="320" class="box" />
    <rect x="10" y="10" width="220" height="140" class="box-muted" />
    <text x="120" y="85" class="text-sm" text-anchor="middle">[ Animal Photo ]</text>
    <rect x="15" y="120" width="70" height="22" class="badge-primary" />
    <text x="50" y="135" font-size="11" font-weight="600" fill="#0369a1" text-anchor="middle">AVAILABLE</text>

    <text x="15" y="175" class="text-md text-bold">Milo</text>
    <text x="225" y="175" class="text-sm" text-anchor="end">Cat</text>
    <text x="15" y="195" class="text-sm">Calm indoor cat looking for a</text>
    <text x="15" y="210" class="text-sm">quiet household to cuddle.</text>

    <!-- Tags -->
    <rect x="15" y="225" width="80" height="20" class="badge" />
    <text x="55" y="239" font-size="10" fill="#475569" text-anchor="middle">House-trained</text>

    <line x1="15" y1="260" x2="225" y2="260" stroke="#e2e8f0" stroke-width="1" />
    <text x="15" y="280" font-size="11" fill="#64748b">Shelter: City Rescues</text>
    <text x="15" y="295" font-size="11" fill="#0284c7" font-weight="600">View Owner Profile →</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(540, 240)">
    <rect width="240" height="320" class="box" />
    <rect x="10" y="10" width="220" height="140" class="box-muted" />
    <text x="120" y="85" class="text-sm" text-anchor="middle">[ Animal Photo ]</text>
    <rect x="15" y="120" width="70" height="22" fill="#fef2f2" stroke="#dc2626" rx="12" />
    <text x="50" y="135" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">ADOPTED</text>

    <text x="15" y="175" class="text-md text-bold">Barnaby</text>
    <text x="225" y="175" class="text-sm" text-anchor="end">Other</text>
    <text x="15" y="195" class="text-sm">Gentle rescue rabbit happily</text>
    <text x="15" y="210" class="text-sm">placed in his forever home.</text>

    <!-- Tags -->
    <rect x="15" y="225" width="70" height="20" class="badge" />
    <text x="50" y="239" font-size="10" fill="#475569" text-anchor="middle">Friendly</text>

    <line x1="15" y1="260" x2="225" y2="260" stroke="#e2e8f0" stroke-width="1" />
    <text x="15" y="280" font-size="11" fill="#64748b">Shelter: Happy Paws</text>
    <text x="15" y="295" font-size="11" fill="#0284c7" font-weight="600">View Owner Profile →</text>
  </g>

  <!-- Pagination Bar (PaginationBar Component) -->
  <g transform="translate(250, 580)">
    <rect x="0" y="0" width="70" height="36" class="box-muted" />
    <text x="35" y="23" class="text-sm" text-anchor="middle">← Prev</text>

    <rect x="80" y="0" width="36" height="36" fill="#0284c7" rx="6" />
    <text x="98" y="23" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>

    <rect x="126" y="0" width="36" height="36" class="box-muted" />
    <text x="144" y="23" class="text-sm" text-anchor="middle">2</text>

    <rect x="172" y="0" width="36" height="36" class="box-muted" />
    <text x="190" y="23" class="text-sm" text-anchor="middle">3</text>

    <rect x="218" y="0" width="70" height="36" class="box-muted" />
    <text x="253" y="23" class="text-sm" text-anchor="middle">Next →</text>
  </g>
</svg>
