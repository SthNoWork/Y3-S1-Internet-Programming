<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%" style="background:#f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
      .text-sm { font-size: 12px; fill: #64748b; }
      .text-md { font-size: 14px; fill: #334155; }
      .text-bold { font-weight: 600; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .box-muted { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
      .badge-primary { fill: #e0f2fe; stroke: #0284c7; rx: 12; }
      .btn { fill: #0284c7; rx: 6; }
    </style>
  </defs>

  <!-- Navbar -->
  <rect x="20" y="20" width="760" height="50" class="box" />
  <text x="40" y="52" class="title">🐾 PawMatch - Animal Adoption</text>

  <!-- Back Link -->
  <text x="25" y="95" font-size="13" font-weight="600" fill="#0284c7">← Back to Animals</text>

  <!-- Main Container -->
  <g transform="translate(20, 110)">
    <!-- Left Column: Large Image & Gallery -->
    <rect width="360" height="510" class="box" />
    <rect x="15" y="15" width="330" height="280" class="box-muted" />
    <text x="180" y="155" class="text-md" text-anchor="middle">[ High-Resolution Photo ]</text>
    <rect x="25" y="25" width="90" height="26" class="badge-primary" />
    <text x="70" y="42" font-size="12" font-weight="600" fill="#0369a1" text-anchor="middle">AVAILABLE</text>

    <!-- Requirements Card -->
    <rect x="15" y="315" width="330" height="175" class="box-muted" />
    <text x="30" y="340" class="text-md text-bold">Adoption Requirements</text>
    <text x="30" y="365" class="text-sm">• Securely fenced yard</text>
    <text x="30" y="385" class="text-sm">• Daily exercise routine (min 45 min)</text>
    <text x="30" y="405" class="text-sm">• No aggressive animals in home</text>
    <text x="30" y="435" font-size="11" fill="#64748b">Adopter screening interview required</text>

    <!-- Right Column: Animal Info & Contact -->
    <g transform="translate(380, 0)">
      <rect width="380" height="510" class="box" />
      <text x="25" y="40" class="title">Luna</text>
      <text x="25" y="60" class="text-sm">Species: Dog | Added: 2026-10-15</text>

      <!-- Tags -->
      <rect x="25" y="75" width="85" height="24" fill="#e2e8f0" rx="12" />
      <text x="67" y="91" font-size="11" fill="#334155" text-anchor="middle">Vaccinated</text>
      <rect x="120" y="75" width="75" height="24" fill="#e2e8f0" rx="12" />
      <text x="157" y="91" font-size="11" fill="#334155" text-anchor="middle">Neutered</text>

      <text x="25" y="130" class="text-md text-bold">About Luna</text>
      <text x="25" y="155" class="text-sm">Luna is a 2-year-old golden retriever mix with an</text>
      <text x="25" y="175" class="text-sm">affectionate personality. She gets along great with</text>
      <text x="25" y="195" class="text-sm">children and other dogs.</text>

      <line x1="25" y1="220" x2="355" y2="220" stroke="#e2e8f0" stroke-width="1.5" />

      <!-- Owner / Shelter Info Card -->
      <rect x="25" y="240" width="330" height="150" class="box-muted" />
      <text x="40" y="265" class="text-md text-bold">Caretaker Information</text>
      <text x="40" y="290" class="text-sm">Shelter: Happy Paws Shelter</text>
      <text x="40" y="310" class="text-sm">Location: Riverside District</text>
      <text x="40" y="330" class="text-sm">Phone: +66 81 234 5678</text>
      <text x="40" y="360" font-size="12" fill="#0284c7" font-weight="600">View Full Caretaker Profile →</text>

      <!-- Inquiry CTA Button -->
      <rect x="25" y="420" width="330" height="48" class="btn" />
      <text x="190" y="450" class="btn-text">Adopt or Inquire About Luna</text>
    </g>
  </g>
</svg>
