services:
  postgres:
    image: postgres:16-alpine
    container_name: pawfinder-postgres
    restart: always
    environment:
      POSTGRES_USER: pawfinder
      POSTGRES_PASSWORD: pawfinder_secret
      POSTGRES_DB: pawfinder_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: